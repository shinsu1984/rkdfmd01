<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e2a4a">
<title>우리 가족 강릉 겨울여행</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%84%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --navy-900:#0a1f38; --navy-800:#123a63; --navy-700:#1c5288;
  --brass:#ff6f81; --brass-light:#ffa9b6; --brass-deep:#e14d64;
  --parchment:#f3f8fc; --paper:#ffffff; --ink:#132338; --ink-soft:#5b6d85; --ink-faint:#9fb0c4;
  --line:#e3edf5; --stamp:#ef4d6b; --good:#0fb28f;
  --sun:#ff6f81; --mint:#4fd1d9;
  --radius:20px; --radius-sm:14px;
  --shadow:0 2px 4px rgba(10,20,40,.06), 0 16px 32px -18px rgba(10,20,40,.30);
  --maxw:480px; --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(640px 320px at 8% -80px, rgba(47,198,198,.14), transparent 62%),
    radial-gradient(680px 360px at 100% 0%, rgba(255,178,56,.10), transparent 60%),
    var(--parchment);
  color:var(--ink); font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Gaegu','Pretendard',sans-serif; font-weight:700; letter-spacing:-.1px;}
button{font-family:inherit;}
#app{max-width:var(--maxw); margin:0 auto; min-height:100vh; background:var(--parchment); position:relative; display:flex; flex-direction:column;}
.btn, .pill, .qtab, .quickbtn, .card, .stampcard{ transition:transform .12s, box-shadow .12s; }
.btn:active, .pill:active, .qtab:active, .quickbtn:active, .stampcard:active, .qopt:active{ transform:scale(.96); }
@keyframes popIn{ 0%{transform:scale(.5); opacity:0;} 60%{transform:scale(1.08); opacity:1;} 100%{transform:scale(1);} }
@keyframes floatUp{ 0%{transform:translateY(0) scale(1); opacity:1;} 100%{transform:translateY(-46px) scale(1.3); opacity:0;} }
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* 히어로 헤더 */
.hero{ background:linear-gradient(150deg, var(--navy-900) 0%, var(--navy-700) 100%); color:#eef3fb; padding:calc(18px + env(safe-area-inset-top, 0px)) 20px 26px; position:relative; overflow:hidden; }
.hero::before{ content:""; position:absolute; inset:0;
  background:radial-gradient(420px 200px at 90% -40px, rgba(79,209,217,.22), transparent 60%),
  radial-gradient(300px 180px at 6% 110%, rgba(255,111,129,.16), transparent 65%),
  radial-gradient(rgba(255,255,255,.18) 1.4px, transparent 1.6px); background-size:auto, auto, 22px 22px; pointer-events:none; }
.hero-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; position:relative;}
.hero-title{ font-size:21px; font-weight:700; margin:0 0 2px; line-height:1.15;
  background:linear-gradient(100deg, var(--mint), var(--brass-light) 70%); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:-.3px; }
.hero-sub{margin:0; font-size:11.5px; color:#cfd9ea; opacity:.9;}
.hero-theme{margin:2px 0 0; font-size:11px; color:var(--brass-light); opacity:.85;}
.hero-date{display:inline-flex; align-items:center; gap:6px; margin-top:9px; padding:6px 12px;
  background:rgba(255,255,255,.1); border:1px solid rgba(47,198,198,.4); border-radius:999px; font-size:11.5px; color:#eef6fb; font-weight:600;}
.admin-btn{ background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.18); color:#eef3fb; border-radius:999px;
  padding:6px 11px; font-size:11px; display:flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap;}
.stamp-badge{ position:relative; min-width:84px; height:66px; border-radius:8px; border:none;
  color:#4a1620; background:linear-gradient(180deg, #fff8ec, #ffe9b8); display:flex; flex-direction:column; align-items:center; justify-content:center;
  transform:rotate(-5deg); flex-shrink:0; box-shadow:0 6px 14px -6px rgba(10,20,40,.35), 0 0 0 1px rgba(255,255,255,.5) inset; margin-top:16px;}
.stamp-badge::before{content:"❄ ❄ ❄"; position:absolute; top:-9px; left:50%; transform:translateX(-50%); font-size:8px; color:rgba(74,22,32,.35); letter-spacing:3px; white-space:nowrap;}
.stamp-badge b{font-family:'Gaegu','Pretendard',sans-serif; font-weight:700; font-size:19px; line-height:1; color:#4a1620;}
.stamp-badge span{font-size:10.5px; letter-spacing:.02em; margin-top:3px; text-align:center; padding:0 6px; color:#7a3a44;}
.ticket-notch{ height:14px; margin-top:-1px;
  background:radial-gradient(circle, rgba(255,255,255,.9) 1.6px, transparent 1.7px) repeat-x; background-size:16px 14px; background-position:0 2px; opacity:.8;}

/* 하단 메인 탭 */
.bottomnav{ position:sticky; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(7,1fr);
  background:var(--paper); border-top:1px solid var(--line); padding:8px 2px calc(8px + var(--safe-b));
  box-shadow:0 -6px 20px -14px rgba(10,20,40,.25);}
.navbtn{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:4px 1px; color:var(--ink-faint); font-size:8.6px; cursor:pointer; border-radius:10px;}
.navbtn .ic{font-size:15.5px; line-height:1;}
.navbtn.active{color:var(--brass-deep); font-weight:700;}

/* 가로 스크롤 필 */
.subtabs{display:flex; gap:8px; overflow-x:auto; padding:14px 16px 4px; scrollbar-width:none;}
.subtabs::-webkit-scrollbar{display:none;}
.pill{ flex:0 0 auto; padding:9px 15px; border-radius:999px; border:1px solid var(--line); background:var(--paper);
  color:var(--ink-soft); font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; display:flex; align-items:center; gap:5px;}
.pill.active{background:var(--navy-800); border-color:var(--navy-800); color:#eef3fb;}

/* 정보탭: 2줄 그리드 서브탭 */
.subtabs-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; padding:14px 16px 4px;}
.subtabs-grid .pill{ width:100%; white-space:normal; text-align:center; justify-content:center; padding:8px 3px; font-size:10.8px; line-height:1.25; }

/* 미션탭: 2x2 그리드 */
.quicktabs{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px 16px 4px;}
.qtab{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 8px; border:1.5px solid var(--line);
  border-radius:14px; background:var(--paper); cursor:pointer; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.qtab .ic{font-size:23px;}
.qtab.active{background:var(--navy-800); border-color:var(--navy-800); color:#eef3fb;}

/* 컨텐츠 카드 */
main{flex:1; padding-bottom:24px;}
.wrap{padding:16px;}
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:14px;}
.card h3{margin:0 0 10px; font-size:15.5px; display:flex; align-items:center; gap:7px;}
.card p{margin:0; color:var(--ink-soft); font-size:13.5px; line-height:1.6;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.dashed{border:none; border-top:1.5px dashed var(--line); margin:12px 0;}
.tag{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; background:#fff0d2; color:#b5660c;}
.tag.green{background:#e0f7f0; color:#0d8a6d;}
.tag.blue{background:#e2f0ff; color:#1c5288;}
.btn{border:none; border-radius:14px; padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer; background:var(--navy-800); color:#eef3fb;}
.btn.gold{background:linear-gradient(120deg, var(--brass), var(--brass-deep)); color:#3a2405; box-shadow:0 8px 18px -8px rgba(226,137,46,.45);}
.btn.ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink); font-weight:600;}
.btn.block{width:100%;}
.btn.sm{padding:8px 12px; font-size:12.5px; border-radius:9px;}
input[type=text], input[type=number], input[type=tel], input[type=password], textarea, select {
  width:100%; border:1.5px solid var(--line); border-radius:11px; padding:11px 13px; font-size:14px; background:var(--paper); color:var(--ink); font-family:inherit;}
textarea{resize:vertical;}
label.field{display:block; font-size:12px; color:var(--ink-soft); margin:0 0 6px; font-weight:600;}

.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px 10px; text-align:center; box-shadow:var(--shadow);}
.stat b{display:block; font-family:'Gaegu','Pretendard',sans-serif; font-weight:700; font-size:25px; color:var(--navy-800);}
.stat span{font-size:11px; color:var(--ink-soft);}

/* 빠른실행 아이콘 */
.quickgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.quickbtn{display:flex; flex-direction:column; align-items:center; gap:3px; padding:16px 6px; border:1px solid var(--line); border-radius:14px; background:var(--paper); cursor:pointer;}
.quickbtn .emoji{font-size:25px;}
.quickbtn b{font-size:12.5px;}
.quickbtn span{font-size:10px; color:var(--ink-soft);}

/* 타임라인 */
.tl{position:relative; padding-left:20px;}
.tl::before{content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1.5px; background:var(--line);}
.tl-item{position:relative; padding-bottom:20px;}
.tl-item::before{content:""; position:absolute; left:-20px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--brass); border:2px solid var(--paper); box-shadow:0 0 0 1.5px var(--brass);}
.tl-time{font-size:12px; color:var(--brass-deep); font-weight:700; font-variant-numeric:tabular-nums;}
.tl-title{font-size:14px; font-weight:600; margin:2px 0 4px;}

/* 퀴즈 */
.qcard{border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;}
.qhead{padding:14px 16px; display:flex; gap:12px; align-items:center; cursor:pointer;}
.qhead .emo{font-size:26px;}
.qbody{padding:0 16px 16px; display:none;}
.qbody.open{display:block;}
.qopt{display:block; width:100%; text-align:left; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; margin-bottom:8px; background:var(--paper); font-size:13.5px; cursor:pointer;}
.qopt.correct{border-color:var(--good); background:#eaf5ee;}
.qopt.wrong{border-color:var(--stamp); background:#fbecea;}
.qopt[disabled]{cursor:default;}
.progress{height:8px; border-radius:999px; background:var(--line); overflow:hidden;}
.progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--brass),var(--brass-deep));}

/* 이야기(상식) */
.jpcat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:14px 16px 4px;}
.jpcat-grid .pill{ width:100%; white-space:normal; text-align:center; justify-content:center; padding:9px 4px; font-size:11.5px; }
.jpcard{border:1.5px solid var(--line); border-radius:var(--radius); background:var(--paper); box-shadow:var(--shadow); margin-bottom:10px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.jpcard.on{border-color:var(--good); background:#eafaf5;}
.jpcard-main{flex:1; cursor:pointer;}
.jpjp{font-family:'Gaegu','Pretendard',sans-serif; font-weight:700; font-size:16px; color:var(--navy-800); display:flex; align-items:center; gap:6px;}
.jpspk{font-size:14px; opacity:.7;}
.jpromaji{font-size:12px; color:var(--brass-deep); font-weight:700; margin-top:2px;}
.jpkr{font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.5;}
.jplearn{flex-shrink:0; border:1.5px solid var(--line); border-radius:999px; background:var(--paper); color:var(--ink-soft); font-size:11.5px; font-weight:700; padding:8px 11px; cursor:pointer; white-space:nowrap;}
.jplearn.on{border-color:var(--good); background:var(--good); color:#fff;}

/* 스탬프/사진/랭킹 */
.pgrid2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.stampcard{border:1.5px solid var(--line); border-radius:14px; padding:14px 8px; text-align:center; background:var(--paper);}
.stampcard.on{border-color:var(--good); background:#eaf5ee;}
.stampicon{font-size:27px;}
.stampname{font-size:12px; font-weight:700; margin-top:5px;}
.stamppts{font-size:11px; color:var(--brass-deep); margin-top:2px; font-weight:700;}
.stampcard.on .stamppts{color:var(--good);}
.pgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.pgrid img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; border:1px solid var(--line);}
.pitem{position:relative;}
.pcap{font-size:11px; color:var(--ink-soft); margin-top:4px;}
.pdelete{position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%; border:none; background:rgba(10,20,40,.6); color:#fff; font-size:13px; font-weight:700; line-height:1; cursor:pointer; z-index:2; display:flex; align-items:center; justify-content:center;}
.upload-box{border:1.5px dashed var(--brass); border-radius:var(--radius-sm); padding:22px 10px; text-align:center; color:var(--brass-deep); font-size:13px; font-weight:600; cursor:pointer; background:#fff8ea;}
.gcard{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); margin-bottom:14px;}
.gcard-body{padding:16px;}
.ranklist{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
.rankrow{display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--line);}
.rankrow:last-child{border-bottom:none;}
.rankno{width:26px; height:26px; border-radius:50%; background:var(--parchment); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink-soft); flex-shrink:0;}
.rankno.gold{background:#e9c46a;color:#5c4108;} .rankno.silver{background:#d7d7d7;color:#4a4a4a;} .rankno.bronze{background:#d7a06a;color:#4a2f0d;}
.rankname{flex:1; font-weight:600; font-size:14px;}
.rankscore{font-weight:700; color:var(--brass-deep); font-variant-numeric:tabular-nums;}
.rdelete{flex-shrink:0; width:24px; height:24px; border-radius:50%; border:1px solid var(--line); background:#fff; color:#b3261e; font-size:12px; font-weight:700; line-height:1; cursor:pointer; margin-left:2px;}

/* 연락처/체크리스트 등 */
.contact-row{display:flex; align-items:center; gap:12px; padding:13px 0;}
.contact-row + .contact-row{border-top:1px solid var(--line);}
.avatar{width:42px; height:42px; border-radius:50%; background:var(--parchment); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
.callbtn{width:38px; height:38px; border-radius:50%; background:#eaf5ee; color:var(--good); display:flex; align-items:center; justify-content:center; text-decoration:none; font-size:16px; flex-shrink:0;}
.chk-row{display:flex; align-items:center; gap:11px; padding:11px 0; font-size:14px;}
.chk-row + .chk-row{border-top:1px solid var(--line);}
.chk-box{width:21px; height:21px; border-radius:6px; border:1.5px solid var(--brass); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer;}
.chk-box.on{background:var(--brass); color:#3a2405;}
.chk-row.done span.lbl{text-decoration:line-through; color:var(--ink-faint);}
#toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--navy-900); color:#eef3fb; padding:10px 18px; border-radius:999px; font-size:13px; z-index:100; opacity:0; pointer-events:none; transition:opacity .25s, bottom .25s; max-width:88%; text-align:center;}
#toast.show{opacity:1; bottom:110px;}
.modal-back{position:fixed; inset:0; background:rgba(10,20,40,.55); z-index:200; display:flex; align-items:flex-end; justify-content:center;}
.modal-back .sheet{width:100%; max-width:var(--maxw); background:var(--paper); border-radius:20px 20px 0 0; padding:22px 18px calc(22px + var(--safe-b)); max-height:85vh; overflow-y:auto; position:relative;}
.modal-back.center{align-items:center;}
.modal-back.center .sheet{border-radius:20px; max-width:340px; margin:0 16px;}
.closeX{position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; color:var(--ink-faint); cursor:pointer;}
.empty{text-align:center; padding:36px 16px; color:var(--ink-faint); font-size:13.5px;}
.section-title{font-size:13px; font-weight:700; color:var(--brass-deep); margin:4px 0 10px; display:flex; align-items:center; gap:6px;}
.banner{background:#fff2da; border:1px solid #ffd98a; color:#8a5711; border-radius:14px; padding:11px 13px; font-size:12.5px; margin-bottom:14px; line-height:1.5;}
.banner.info{background:#e6f4fb; border-color:#bfe2f4; color:#0e4d6e;}
::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div id="app">
  <header class="hero" id="hero"></header>
  <div class="ticket-notch"></div>
  <main id="main"></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================================
   설정 데이터 — 우리 가족 강릉 겨울여행
   ========================================================================= */
const TRIP = {
  title: '우리 가족 강릉 겨울여행', subtitle: '상운이·지연이·수윤이·서윤이·다윤이',
  theme: '겨울바다 · 눈꽃 · 가족 추억여행', startDate: '2026-12-28', endDate: '2026-12-31',
  emoji:'❄️', checkinTime:'오후 3:00', checkoutTime:'오전 11:00',
};
const STAY_DEFAULT = {
  name:'강릉시의 방', host:'비비르 알 디아', address:'강원 강릉시 사천진리 진리항구2길 5 (사천진해변 바로 앞)',
  lat:37.8286, lng:128.8654, hostPhone:'', hostKakao:'', familyOpenchat:''
};
const FAMILY_DEFAULT = ['상운이','지연이','수윤이','서윤이','다윤이'];

/* '가볼 곳' 스탬프 랠리 — 우리가 실제로 가면 좋은 강릉 명소. lat/lng는 GPS 도장(스탬프)용 근사 좌표예요. */
const GUIDE = [

function haversine(lat1,lon1,lat2,lon2){ const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); return 2*R*Math.asin(Math.sqrt(a)); }
function compressImage(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=()=>reject(new Error('이미지를 읽을 수 없어요')); img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('파일을 읽을 수 없어요')); reader.readAsDataURL(file);
  });
}
function todayStr(){ const t=new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function dowKo(dateStr){ return ['일','월','화','수','목','금','토'][new Date(dateStr+'T00:00:00').getDay()]; }
function fmtMD(dateStr){ const d=new Date(dateStr+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}(${dowKo(dateStr)})`; }
function fmtRangeKo(s,e){ const sd=new Date(s+'T00:00:00'), ed=new Date(e+'T00:00:00'); return `${sd.getFullYear()}.${sd.getMonth()+1}.${sd.getDate()}(${dowKo(s)}) ~ ${ed.getMonth()+1}.${ed.getDate()}(${dowKo(e)}) · 3박4일`; }
function ddayInfo(){
  const today=todayStr(); const n=daysBetween(today, TRIP.startDate); const mEnd=daysBetween(today, TRIP.endDate);
  if(n>0) return {state:'before', daysLeft:n, badge:'D-'+n, badgeSub:'출발 전'};
  if(mEnd>=0){ const dayIndex=-n; return {state:'during', dayIndex, badge:(dayIndex+1)+'일차', badgeSub:'여행 중'}; }
  return {state:'after', badge:'완료', badgeSub:'여행 종료'};
}

async function syncMyScore(){
  const name=getMyName(); if(!name) return;
  const quiz=sumQuizScore(), challengeScore=sumPhotoScore(), stampPts=stampPointsEarned()+preStampPointsEarned();
  const factPts = factsLearnedCount() * 5;
  const uploadPts = photoUploadScore();
  let photoScore = challengeScore + uploadPts;
  let data = {quizScore:quiz, photoScore, stampScore:stampPts, factScore:factPts, uploadScore:uploadPts};
  /* 다른 기기(가족 각자 폰)는 이 기기의 진행 상황을 모르는 "빈 상태"로 시작해요.
     그대로 덮어쓰면 이미 쌓여있던 점수가 깎일 수 있어서, 기존 값과 비교해 더 큰 쪽만 저장해요. */
  if(firebaseReady){
    try{
      const snap = await db.collection('rankings').doc(sanitizeId(name)).get();
      if(snap.exists){
        const prev = snap.data() || {};
        data.quizScore = Math.max(data.quizScore, prev.quizScore||0);
        data.stampScore = Math.max(data.stampScore, prev.stampScore||0);
        data.factScore = Math.max(data.factScore, prev.factScore||0);
        data.uploadScore = Math.max(data.uploadScore, prev.uploadScore||0);
        data.photoScore = Math.max(data.photoScore, prev.photoScore||0, data.uploadScore);
      }
    }catch(e){ warnFirestoreOnce(e); }
  }
  data.totalScore = data.quizScore + data.photoScore + data.stampScore + data.factScore;
  await submitRanking(name, {name, ...data, updatedAt:Date.now()});
}

const QUIZ_OPTION_ORDER = {};
function getQuizOptionOrder(qid, qi, len){
  const key = qid+'_'+qi;
  if(!QUIZ_OPTION_ORDER[key]){
    const arr = Array.from({length:len}, (_,i)=>i);
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    QUIZ_OPTION_ORDER[key]=arr;
  }
  return QUIZ_OPTION_ORDER[key];
}
function renderQuizQuestion(set,q,qi){
  const a=getQuizAnswers(); const chosen=a[quizAnswerKey(set.id,qi)]; const answered=chosen!==undefined;
  const order=getQuizOptionOrder(set.id, qi, q.opts.length);
  return `<div style="margin-bottom:6px;"><div style="font-size:11px; color:var(--brass-deep); font-weight:700; margin-bottom:4px;">${q.type}</div><div style="font-size:13.5px; font-weight:600; margin-bottom:9px;">${q.q}</div>
    ${order.map(oi=>{ const opt=q.opts[oi]; let cls='qopt'; if(answered){ if(oi===q.answer) cls+=' correct'; else if(oi===chosen) cls+=' wrong'; } return `<button class="${cls}" ${answered?'disabled':''} onclick="answerQuiz('${set.id}',${qi},${oi})">${opt}</button>`; }).join('')}
    ${answered?`<p style="font-size:12px; color:var(--ink-soft); margin-top:4px;">💡 ${q.note}</p>`:''}</div>`;
}
function answerQuiz(qid,qi,oi){
  const a=getQuizAnswers(); const key=quizAnswerKey(qid,qi); if(a[key]!==undefined) return; setQuizAnswer(qid,qi,oi);
  const set=QUIZZES.find(s=>s.id===qid); const correct=oi===set.questions[qi].answer;
  toast(correct? '정답이에요! 🎉' : '아쉬워요, 다음 문제도 도전해봐요!');
  if(correct) celebrate(); renderAll(); syncMyScore();
}
function missionStampHtml(){
  const stamps=getStamps(), got=Object.keys(stamps).length, earnedPts=stampPointsEarned();
  let html=`<div class="card"><h3>🏅 여행지 스탬프 랠리</h3><p>장소 근처(약 800m 이내)에 가면 GPS로 도장이 자동으로 찍혀요!</p>
    <div class="stats" style="grid-template-columns:repeat(3,1fr); margin-top:12px;"><div class="stat"><b>${got}</b><span>획득 도장</span></div><div class="stat"><b>${GUIDE.length}</b><span>전체 도장</span></div><div class="stat"><b>${earnedPts}</b><span>스탬프 점수</span></div></div>
    <button class="btn gold block" style="margin-top:12px;" onclick="tryStamp()">📍 지금 위치로 도장 받기</button><div id="gpsStatus" style="font-size:12px; color:var(--ink-soft); margin-top:8px;"></div></div>`;
  html+=`<div class="section-title">🗺️ 방문지 스탬프</div><div class="pgrid2">`+GUIDE.map(g=>{ const on=!!stamps[g.name]; return `<div class="stampcard ${on?'on':''}"><div class="stampicon">${g.icon}</div><div class="stampname">${g.name}</div><div class="stamppts">${on?'✓ 획득':'+'+g.points+'점'}</div></div>`; }).join('')+`</div>`;

function tryStamp(){
  const status=document.getElementById('gpsStatus');
  if(!navigator.geolocation){ status.textContent='이 기기에서는 위치 확인을 지원하지 않아요.'; return; }
  status.textContent='위치 확인 중...';
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude,accuracy}=pos.coords; let nearest=null, nd=Infinity;
    GUIDE.forEach(g=>{ const dist=haversine(latitude,longitude,g.lat,g.lng); if(dist<nd){ nd=dist; nearest=g; } });
    let msg='';
    if(nearest && nd<=800){
      const stamps=getStamps();
      if(!stamps[nearest.name]){ stamps[nearest.name]=Date.now(); lsSet('stamps',stamps); toast('🎉 '+nearest.name+' 도장 획득! +'+nearest.points+'점'); celebrate(); syncMyScore(); }
      else toast('이미 도장을 받은 곳이에요.');
      msg=`${nearest.name}까지 약 ${Math.round(nd)}m · GPS 정확도 ±${Math.round(accuracy)}m`;
    } else if(nearest){ msg=`가장 가까운 곳: ${nearest.name} (약 ${(Math.round(nd/100)/10)}km) — 800m 이내로 이동해보세요.`; }
    // renderAll()이 화면을 다시 그리면서 #gpsStatus 노드가 새로 생기므로, 렌더링 후 다시 찾아서 넣어야 실제로 보임.
    renderAll();
    const status2=document.getElementById('gpsStatus'); if(status2) status2.textContent=msg;
  }, ()=>{ const s=document.getElementById('gpsStatus'); if(s) s.textContent='위치 정보를 가져올 수 없어요. 위치 권한을 확인해주세요.'; }, {enableHighAccuracy:true, timeout:10000});
}
/* ---------- 사전연습: 우리 동네(집현면) GPS 스탬프 미리 테스트 ---------- */
function getPreStamps(){ return lsGet('prestamps2', {}); }
/* 누군가 현장에서 등록한 좌표(pre_stamp_spots)가 있으면 그걸, 없으면 기본값(미등록 상태)을 씀 */
function getPreStampList(){
  const v=lsGet('pre_stamp_spots', null);
  return (Array.isArray(v) && v.length) ? v : PRE_STAMPS;
}
function preStampReady(){ return getPreStampList().every(g=>g.set); }
function preStampPointsEarned(){ const st=getPreStamps(); return getPreStampList().reduce((s,g)=> s+(st[g.name]? (g.points||10):0), 0); }
function fmtDist(m){ return m<1000 ? Math.round(m)+'m' : (Math.round(m/100)/10)+'km'; }
function tryPreStamp(){
  const status=document.getElementById('preGpsStatus');
  if(!navigator.geolocation){ status.textContent='이 기기에서는 위치 확인을 지원하지 않아요.'; return; }
  status.textContent='위치 확인 중... (바깥에서 잠시 기다려주세요)';
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude,accuracy}=pos.coords; let nearest=null, nd=Infinity;
    const list=getPreStampList();
    list.forEach(g=>{ const dist=haversine(latitude,longitude,g.lat,g.lng); if(dist<nd){ nd=dist; nearest=g; } });
    const limit = PRE_STAMP_RADIUS + Math.min(accuracy||0, 50); // GPS 오차를 최대 50m까지 봐줌
    let msg='';
    if(nearest && nd<=limit && nearest.set){
      const st=getPreStamps();
      if(!st[nearest.name]){ st[nearest.name]=Date.now(); lsSet('prestamps2',st); toast('🎉 '+nearest.name+' 스탬프 획득! +'+(nearest.points||10)+'점'); celebrate(); syncMyScore(); }
      else toast('이미 스탬프를 받은 곳이에요.');
      msg=`${nearest.name}까지 약 ${Math.round(nd)}m · GPS 정확도 ±${Math.round(accuracy)}m`;
    } else if(nearest){
      msg=`가장 가까운 곳: ${nearest.name} (약 ${fmtDist(nd)}) — ${PRE_STAMP_RADIUS}m 이내로 가까이 가보세요.`;
      if(!nearest.set) msg='아직 등록된 장소가 없어요. 관리자 설정에서 그 장소에 가서 위치를 등록해주세요.';
    }
    renderAll();
    const status2=document.getElementById('preGpsStatus'); if(status2) status2.textContent=msg;
  }, ()=>{ const s=document.getElementById('preGpsStatus'); if(s) s.textContent='위치 정보를 가져올 수 없어요. 위치 권한을 확인해주세요.'; }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}
function viewPretest(){
  const preStamps=getPreStamps(), preList=getPreStampList(), donePs=preList.filter(g=>preStamps[g.name]).length;
  let html=`<div class="wrap">
    <div class="banner info">📍 <b>사전연습</b> · 강릉 가기 전에 우리 동네(집현면)에서 GPS 스탬프가 잘 되는지 미리 테스트해봐요. 강릉 스탬프와는 완전히 별개예요.</div>
    <div class="card"><h3>🚩 우리 동네 GPS 테스트</h3>
      <div class="stats" style="grid-template-columns:repeat(3,1fr); margin-top:10px;"><div class="stat"><b>${donePs}</b><span>획득</span></div><div class="stat"><b>${preList.length}</b><span>전체</span></div><div class="stat"><b>${preStampPointsEarned()}</b><span>스탬프 점수</span></div></div>
      <p style="margin-top:10px;">아래 장소 바로 앞(약 ${PRE_STAMP_RADIUS}m 이내)에 가서 버튼을 누르면 GPS로 스탬프가 찍혀요.</p>
      ${preStampReady()?'':`<div class="banner" style="margin-top:10px;">⏳ 아직 위치가 등록되지 않은 장소가 있어요. ⚙️설정 → "우리 동네 스탬프 위치 등록"에서 그 자리에 가서 등록해주세요.</div>`}
      <button class="btn gold block" style="margin-top:10px;" onclick="tryPreStamp()">📍 지금 위치로 스탬프 받기</button>
      <div id="preGpsStatus" style="font-size:12px; color:var(--ink-soft); margin-top:8px;"></div>
      ${donePs===preList.length?`<div class="banner" style="margin-top:10px;">🎉 우리 동네 스탬프를 다 모았어요!</div>`:''}
    </div>
    <div class="section-title">🗺️ 우리 동네 스탬프</div>
    <div class="pgrid2">${preList.map(g=>{ const on=!!preStamps[g.name]; return `<div class="stampcard ${on?'on':''}"><div class="stampicon">${g.icon}</div><div class="stampname">${g.name}${g.set?'':' (미등록)'}</div><div class="stamppts">${on?'✓ 획득':'+'+(g.points||10)+'점'}</div></div>`; }).join('')}</div>
  </div>`;
  return html;
}
/* ---------- 관리자: 우리 동네 스탬프 위치를 현장에서 등록 ----------
   그 장소 앞에 서서 버튼을 누르면 GPS 좌표가 바로 저장되고, Firestore로 다른 가족 폰에도 반영돼요. */
function savePreSpots(list){
  lsSet('pre_stamp_spots', list);
  if(firebaseReady){
    db.collection('settings').doc('gangneung_family').set({ pre_stamp_spots: list, updatedAt: Date.now() }, {merge:true})
      .catch(e=>{ console.warn('스탬프 위치 전송 실패', e); toast('⚠️ 서버 전송 실패 — 인터넷 연결을 확인해주세요.'); });
  }
}
function preSpotsFromPanel(){
  const list=getPreStampList().map(g=>({...g}));
  document.querySelectorAll('.psName').forEach(el=>{ const i=Number(el.dataset.idx); if(list[i]){ const v=el.value.trim(); if(v) list[i].name=v; } });
  return list;
}
function preSpotStatusHtml(g){
  return g.set
    ? `<span style="color:var(--good); font-weight:700;">✅ 등록됨</span> <span style="color:var(--ink-faint);">(${Number(g.lat).toFixed(5)}, ${Number(g.lng).toFixed(5)}${g.acc?` · ±${g.acc}m`:''})</span>`
    : `<span style="color:var(--stamp); font-weight:700;">⚠️ 아직 등록 안 됨</span> <span style="color:var(--ink-faint);">— 그 장소 앞에서 눌러주세요</span>`;
}
function registerPreSpot(i){
  if(!navigator.geolocation){ toast('이 기기에서는 위치 확인을 지원하지 않아요.'); return; }
  const line=document.getElementById('psStatus'+i); if(line) line.innerHTML='📡 위치 확인 중... 건물 앞 바깥에서 잠시 기다려주세요';
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude,accuracy}=pos.coords;
    const list=preSpotsFromPanel();
    list[i]={...list[i], lat:Number(latitude.toFixed(6)), lng:Number(longitude.toFixed(6)), set:true, acc:Math.round(accuracy)};
    savePreSpots(list);
    const l2=document.getElementById('psStatus'+i); if(l2) l2.innerHTML=preSpotStatusHtml(list[i]);
    if(accuracy>60) toast(`⚠️ GPS 오차가 커요(±${Math.round(accuracy)}m). 건물 밖 하늘이 보이는 곳에서 한 번 더 눌러주세요.`);
    else toast(`📍 ${list[i].name} 위치를 등록했어요!`);
  }, ()=>{ const l3=document.getElementById('psStatus'+i); if(l3) l3.innerHTML='❌ 위치를 가져오지 못했어요. 위치 권한을 확인해주세요.'; }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
}
function preSpotsAdminHtml(){
  const list=getPreStampList();
  return `<label class="field">📍 우리 동네 스탬프 위치 등록 (사전연습)</label>
    <p style="font-size:11.5px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5;">각 장소 <b>바로 앞(건물 밖)</b>에 서서 <b>"지금 여기로 등록"</b>을 누르면 GPS 위치가 저장돼요. 실제로 없는 장소면 이름을 바꿔서 다른 곳으로 써도 돼요(이름은 아래 저장 버튼으로 저장).</p>
    ${list.map((g,i)=>`<div style="margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #f0f0f0;">
      <div style="display:flex; gap:6px; align-items:center;">
        <span style="font-size:18px;">${g.icon||'📍'}</span>
        <input type="text" class="psName" data-idx="${i}" value="${escAttr(g.name)}" style="flex:1;">
        <button class="btn ghost sm" style="flex-shrink:0;" onclick="registerPreSpot(${i})">📍 지금 여기로 등록</button>
      </div>
      <div id="psStatus${i}" style="font-size:11.5px; margin-top:5px;">${preSpotStatusHtml(g)}</div>
    </div>`).join('')}<hr class="dashed">`;
}
function missionPhotoHtml(){
  const done=getPhotoChallenges(), doneCount=Object.keys(done).length;
  let html=`<div class="card"><h3>📸 포토챌린지</h3><p>${doneCount}/${PHOTO_CHALLENGES.length} 완료 · 사진을 올리면 바로 완료 처리돼요!</p>
    <div class="progress" style="margin-top:10px;"><i style="width:${doneCount/PHOTO_CHALLENGES.length*100}%"></i></div></div>`;
  PHOTO_CHALLENGES.forEach(c=>{
    const d=done[c.id];
    html+=`<div class="card"><div class="row-between"><h3 style="margin:0;">${c.icon} ${c.title}</h3><span class="tag green">+${c.points}점</span></div><p style="margin-top:6px;"><span class="tag blue" style="margin-right:6px;">${c.place}</span>${c.desc}</p>
      ${d?`<div style="position:relative;"><img src="${d.img}" style="width:100%; border-radius:12px; margin-top:10px; border:1px solid var(--line);"><button class="pdelete" onclick="retakePhotoChallenge('${c.id}')" title="다시 찍기">✕</button></div><p style="color:var(--good); font-weight:700; margin-top:6px;">✅ 완료했어요!</p><button class="btn ghost block sm" style="margin-top:4px;" onclick="retakePhotoChallenge('${c.id}')">🔄 잘못 올렸어요, 다시 찍기</button>`
        :`<label class="upload-box" style="display:block; margin-top:10px;" id="upl-${c.id}">📷 사진을 선택하세요<input type="file" accept="image/*" capture="environment" style="display:none" onchange="completePhotoChallenge('${c.id}', this)"></label>`}</div>`;
  });
  return html;
}
async function completePhotoChallenge(id, input){
  const file=input.files[0]; if(!file) return; const box=document.getElementById('upl-'+id);
  try{
    const dataUrl=await compressImage(file, 700, 0.65);
    const d=getPhotoChallenges(); d[id]={img:dataUrl, ts:Date.now()}; lsSet('photo_challenges', d);
    toast('미션 완료! 🎉'); celebrate(); renderAll(); syncMyScore();
  }catch(e){ toast('사진을 불러오지 못했어요. 다른 사진으로 시도해주세요.'); if(box) box.textContent='📷 사진을 선택하세요'; }
}
function retakePhotoChallenge(id){
  if(!confirm('이 미션 사진을 지우고 다시 찍을까요?')) return;
  const d=getPhotoChallenges(); delete d[id]; lsSet('photo_challenges', d);
  toast('삭제했어요. 다시 찍어보세요!'); renderAll(); syncMyScore();
}
function missionRandomHtml(){
  const current=ui.randomMission;
  const count=lsGet('random_count_'+todayStr(), 0);
  return `<div class="card" style="text-align:center;"><h3>🎲 랜덤 미션 뽑기</h3><p>버튼을 누르면 깜짝 미션이 나타나요! <br><span style="color:var(--brass-deep); font-weight:700;">(오늘 ${count}/10회 달성)</span></p>
    ${current?`<div style="margin:16px 0; padding:16px; background:var(--parchment); border-radius:14px;"><div style="font-size:14.5px; font-weight:700;">${escapeHtml(current.title)}</div><div class="tag" style="margin-top:8px;">+${current.points}점</div></div>
      <button class="btn gold block" onclick="completeRandomMission()">완료했어요!</button>`
      :`<button class="btn gold block" style="margin-top:16px;" ${count>=10?'disabled':''} onclick="drawRandomMission()">${count>=10?'오늘 도전 끝! 내일 만나요':'🎲 미션 뽑기!'}</button>`}
  </div>`;
}
function drawRandomMission(){
  if(lsGet('random_count_'+todayStr(), 0) >= 10){ toast('하루 10번까지만 가능해요!'); return; }
  ui.randomMission=RANDOM_MISSIONS[Math.floor(Math.random()*RANDOM_MISSIONS.length)]; renderAll();
}
function completeRandomMission(){
  if(!ui.randomMission) return;
  lsSet('random_count_'+todayStr(), lsGet('random_count_'+todayStr(), 0) + 1);
  lsSet('random_score', lsGet('random_score',0)+ui.randomMission.points);
  toast('미션 완료! +'+ui.randomMission.points+'점'); celebrate(); ui.randomMission=null; renderAll(); syncMyScore();
}

/* ---------- 이야기(상식) ---------- */
function viewStory(){
  const learned=getFactsLearned();
  let html=`<div class="wrap"><div class="card" style="text-align:center;"><div class="serif" style="font-size:30px; color:var(--navy-800);">${factsLearnedCount()}/${factsAllCount()}</div><p>강릉 이야기 배우기</p></div></div>`;
  html+=`<div class="jpcat-grid">${GANGNEUNG_FACTS.map((c,i)=>`<button class="pill ${ui.factCat===i?'active':''}" onclick="ui.factCat=${i}; renderAll();">${c.icon} ${c.cat}</button>`).join('')}</div>`;
  const cat=GANGNEUNG_FACTS[ui.factCat];
  html+=`<div class="wrap" style="padding-top:6px;">`+cat.items.map((it,ii)=>{ const key=factKey(ui.factCat,ii); const on=!!learned[key];
    return `<div class="jpcard ${on?'on':''}"><div class="jpcard-main"><div class="jpjp">${it.title}</div><div class="jpkr">${it.detail}</div></div><button class="jplearn ${on?'on':''}" onclick="toggleFactLearned(${ui.factCat},${ii})">${on?'✓ 배웠어요':'외웠어요'}</button></div>`; }).join('')+`</div>`;
  return html;
}
function toggleFactLearned(ci,ii){ const key=factKey(ci,ii); const learned=getFactsLearned(); learned[key]=!learned[key]; lsSet('facts_learned', learned); renderAll(); syncMyScore(); }

/* ---------- 사진 ---------- */
function viewPhoto(){
  const sub=ui.photoSub||'mine';
  return `<div class="subtabs" style="padding-left:16px; padding-right:16px;">
    <button class="pill ${sub!=='shared'?'active':''}" onclick="ui.photoSub='mine'; renderAll();">📱 내 사진</button>
    <button class="pill ${sub==='shared'?'active':''}" onclick="ui.photoSub='shared'; renderAll();">🌍 공유 갤러리</button>
  </div><div class="wrap" style="padding-top:6px;">${sub==='shared'? photoSharedHtml() : photoMineHtml()}</div>`;
}
function photoMineHtml(){
  const photos=getMyPhotos();
  let html=`<label class="upload-box" style="display:block;" id="uplMine">📷 사진 올리기<input type="file" accept="image/*" style="display:none" onchange="addMyPhoto(this)"></label>`;
  if(photos.length===0){ html+=`<div class="empty">아직 올린 사진이 없어요. 첫 추억을 남겨보세요!</div>`; }
  else{
    html+=`<div class="pgrid" style="margin-top:14px;">`+photos.map((p,i)=>`<div class="pitem"><img src="${p.img}"><button class="pdelete" onclick="deleteMyPhoto(${i})">✕</button><div class="pcap">${new Date(p.ts).toLocaleDateString('ko-KR')}</div></div>`).join('')+`</div>`;
  }
  return html;
}
async function addMyPhoto(input){
  const file=input.files[0]; if(!file) return;
  try{ const dataUrl=await compressImage(file, 900, 0.7); const list=getMyPhotos(); list.push({img:dataUrl, ts:Date.now()}); lsSet('my_photos', list); toast('사진을 저장했어요!'); renderAll(); syncMyScore(); }
  catch(e){ toast('사진을 불러오지 못했어요.'); }
}
function deleteMyPhoto(i){ const list=getMyPhotos(); list.splice(i,1); lsSet('my_photos', list); renderAll(); }
function photoSharedHtml(){ return `<div id="galleryBody"><div class="empty">불러오는 중...</div></div><label class="upload-box" style="display:block; margin-top:14px;" id="uplShared">📤 공유 갤러리에 올리기<input type="file" accept="image/*" style="display:none" onchange="addSharedPhoto(this)"></label>`; }
async function loadGallery(){
  const body=document.getElementById('galleryBody'); if(!body) return;
  const list=await fetchGallery();
  if(list.length===0){ body.innerHTML=`<div class="empty">아직 공유된 사진이 없어요. 첫 추억을 올려보세요!</div>`; return; }
  body.innerHTML=`<div class="pgrid">`+list.map((p,i)=>`<div class="pitem"><img src="${p.img}">${isAdminSession?`<button class="pdelete" onclick="deleteSharedPhoto(${i})">✕</button>`:''}<div class="pcap">${escapeHtml(p.name||'')}</div></div>`).join('')+`</div>`;
}
async function addSharedPhoto(input){
  const file=input.files[0]; if(!file) return; const name=getMyName();
  if(!name){ toast('먼저 랭킹 탭에서 이름을 등록해주세요.'); return; }
  try{
    const dataUrl=await compressImage(file, 900, 0.7);
    await addGalleryPhoto({img:dataUrl, name, createdAt:Date.now()});
    lsSet('shared_photo_count', lsGet('shared_photo_count',0)+1);
    toast('공유 갤러리에 올렸어요! 🎉'); celebrate(); renderAll(); loadGallery(); syncMyScore();
  }catch(e){ toast('업로드에 실패했어요.'); }
}
async function deleteSharedPhoto(i){
  if(!confirm('이 사진을 삭제할까요?')) return;
  const list=await fetchGallery(); const ok=await deleteGalleryPhotoAt(list, i);
  if(ok){ toast('삭제했어요.'); loadGallery(); } else toast('삭제에 실패했어요.');
}

/* ---------- 랭킹 ---------- */
function viewRank(){
  const name=getMyName();
  let html=`<div class="wrap">`;
  if(!name){
    html+=`<div class="card"><h3>👋 이름을 등록해주세요</h3><p>가족 중 누구인지 골라주세요. 점수가 자동으로 저장돼요.</p>
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;">${FAMILY_DEFAULT.map(n=>`<button class="pill" onclick="registerName('${escAttr(n)}')">${n}</button>`).join('')}</div>
      <hr class="dashed"><input type="text" id="customName" placeholder="다른 이름으로 등록"><button class="btn gold block" style="margin-top:8px;" onclick="registerName(document.getElementById('customName').value.trim())">등록</button></div>`;
  } else {
    html+=`<div class="card" style="text-align:center;"><p>현재 <b style="color:var(--brass-deep)">${escapeHtml(name)}</b>(으)로 참여 중이에요.</p><button class="btn ghost block sm" style="margin-top:10px;" onclick="changeMyName()">이름 바꾸기</button></div>`;
  }
  html+=`<div id="rankBody"><div class="empty">불러오는 중...</div></div></div>`;
  return html;
}
function registerName(name){ if(!name) return; lsSet('myname', name); toast(name+'(으)로 등록했어요!'); renderAll(); syncMyScore(); }
function changeMyName(){ if(confirm('이름을 바꾸면 이 기기의 이름 등록이 초기화돼요. 계속할까요?')){ lsSet('myname',''); renderAll(); } }
async function loadRankBody(){
  const body=document.getElementById('rankBody'); if(!body) return;
  const list=await fetchRanking();
  if(list.length===0){ body.innerHTML=`<div class="empty">아직 등록된 점수가 없어요.</div>`; return; }
  const sorted=list.slice().sort((a,b)=>(b.totalScore||0)-(a.totalScore||0));
  const medal=(i)=> i===0?'gold':i===1?'silver':i===2?'bronze':'';
  body.innerHTML=`<div class="ranklist">`+sorted.map((r,i)=>`<div class="rankrow"><div class="rankno ${medal(i)}">${i+1}</div><div class="rankname">${escapeHtml(r.name)}</div><div class="rankscore">${r.totalScore||0}점</div>${isAdminSession?`<button class="rdelete" onclick="removeRanking('${escAttr(r.name)}')">✕</button>`:''}</div>`).join('')+`</div>`;
}
async function removeRanking(name){
  if(!confirm(name+' 기록을 삭제할까요?')) return;
  const ok=await deleteRankingEntry(name);
  if(ok){ toast('삭제했어요.'); loadRankBody(); } else toast('삭제에 실패했어요.');
}

/* ---------- 설정(관리자) ---------- */
function openAdminGate(){ openCenter(`<button class="closeX" onclick="closeModal()">✕</button><h3>🔒 설정</h3><p style="font-size:13px; color:var(--ink-soft); margin-bottom:12px;">숙소 정보와 연락처를 관리할 수 있어요.</p><input type="password" id="adminPass" placeholder="비밀번호"><button class="btn gold block" style="margin-top:12px;" onclick="checkAdminPass()">확인</button><p style="font-size:11px; color:var(--ink-faint); margin-top:10px;">기본 비밀번호: gangneung2026</p>`); }
function checkAdminPass(){ const v=document.getElementById('adminPass').value; if(v===lsGet('admin_pass','gangneung2026')){ isAdminSession=true; closeModal(); openAdminPanel(); } else toast('비밀번호가 올바르지 않아요.'); }
function openAdminPanel(){
  const stay=lsGet('stay', STAY_DEFAULT);
  openSheet(`<button class="closeX" onclick="closeModal()">✕</button><h3>⚙️ 설정</h3>
    ${preSpotsAdminHtml()}
    <label class="field">숙소 이름</label>
    <input type="text" id="stayName" value="${escAttr(stay.name)}" style="margin-bottom:8px;">
    <label class="field">숙소 주소</label>
    <input type="text" id="stayAddress" value="${escAttr(stay.address)}" style="margin-bottom:8px;">
    <hr class="dashed"><label class="field">호스트 이름</label>
    <input type="text" id="hostName" value="${escAttr(stay.host)}" style="margin-bottom:8px;">
    <input type="tel" id="hostPhone" placeholder="호스트 연락처 (선택)" value="${escAttr(stay.hostPhone||'')}" style="margin-bottom:8px;">
    <input type="text" id="hostKakao" placeholder="호스트 카카오톡 1:1 링크 (선택)" value="${escAttr(stay.hostKakao||'')}">
    <hr class="dashed"><label class="field">우리 가족 단체 오픈채팅방 링크 (선택)</label>
    <input type="text" id="familyOpenchat" value="${escAttr(stay.familyOpenchat||'')}">
    <hr class="dashed"><label class="field">비밀번호 변경 (선택)</label>
    <input type="password" id="newPass" placeholder="새 비밀번호">
    <button class="btn gold block" style="margin-top:16px;" onclick="saveAdmin()">저장</button>
    <hr class="dashed">
    <h4 style="margin:4px 0 4px;">☁️ 공유 갤러리 연동 (파이어베이스)</h4>
    <p class="muted" style="font-size:12px;line-height:1.5;">
      우리 가족 전용 파이어베이스 프로젝트가 앱에 이미 내장돼 있어요. 가족 누구나 앱을 열기만 하면 자동으로 같은 갤러리·랭킹을 공유해요 — 따로 설정할 필요 없어요.
      (다른 프로젝트로 바꾸고 싶을 때만 아래에 새 설정 코드를 붙여넣으세요.) 여행 끝나고 나면 Firebase 콘솔 → Firestore → 규칙 탭에서 <code>allow read, write: if false;</code>로 잠가두는 걸 추천해요.
    </p>
    <textarea id="firebaseConfigText" placeholder='예) const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", ... };' style="width:100%;min-height:90px;font-size:12px;"></textarea>
    <button class="btn ghost block" style="margin-top:8px;" onclick="saveFirebaseConfig()">파이어베이스 연결 저장</button>
    ${FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey ? `<p class="muted" style="font-size:12px;margin-top:6px;">✅ 현재 연결된 프로젝트: ${escapeHtml(FIREBASE_CONFIG.projectId||'')}</p><button class="btn ghost block" onclick="clearFirebaseConfig()">연결 해제</button>` : `<p class="muted" style="font-size:12px;margin-top:6px;">아직 연결 안 됨 (연결 전까지는 이 기기에만 저장돼요)</p>`}
    <hr class="dashed">
    <button class="btn ghost block" style="margin-top:8px;" onclick="confirmReset()">🗑️ 이 기기 기록 초기화</button>
  `);
}
function saveAdmin(){
  const stay = {
    name: document.getElementById('stayName').value.trim()||STAY_DEFAULT.name,
    address: document.getElementById('stayAddress').value.trim()||STAY_DEFAULT.address,
    host: document.getElementById('hostName').value.trim()||STAY_DEFAULT.host,
    hostPhone: document.getElementById('hostPhone').value.trim(),
    hostKakao: document.getElementById('hostKakao').value.trim(),
    familyOpenchat: document.getElementById('familyOpenchat').value.trim(),
    lat: STAY_DEFAULT.lat, lng: STAY_DEFAULT.lng,
  };
  lsSet('stay', stay);
  const np=document.getElementById('newPass').value.trim(); if(np) lsSet('admin_pass', np);
  if(document.querySelector('.psName')) savePreSpots(preSpotsFromPanel()); // 스탬프 위치 이름 변경 저장
  if(firebaseReady){
    db.collection('settings').doc('gangneung_family').set({ stay, updatedAt: Date.now() }, {merge:true}).catch(e=>console.warn("설정 전송 실패", e));
  }
  toast('저장했어요!'); closeModal(); renderAll();
}
function parseFirebaseConfigText(text){
  // Firebase 콘솔이 보여주는 형태(순수 JSON이 아닐 수 있음)를 너그럽게 파싱
  const out={};
  const keys=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
  keys.forEach(k=>{
    const re=new RegExp(k+'\\s*:\\s*["\']([^"\']*)["\']');
    const m=text.match(re);
    if(m) out[k]=m[1];
  });
  return out;
}
function saveFirebaseConfig(){
  const text=document.getElementById('firebaseConfigText').value.trim();
  if(!text){ toast('설정 코드를 먼저 붙여넣어 주세요'); return; }
  const parsed=parseFirebaseConfigText(text);
  if(!parsed.apiKey || !parsed.projectId){ toast('apiKey / projectId를 찾지 못했어요. 콘솔의 코드를 그대로 붙여넣어 보세요.'); return; }
  localStorage.setItem('gnfam_firebase_config', JSON.stringify(parsed));
  toast('연결했어요! 새로고침할게요.');
  setTimeout(()=>location.reload(), 700);
}
function clearFirebaseConfig(){
  if(!confirm('직접 붙여넣은 연결을 지우고, 앱에 기본으로 내장된 우리 가족 프로젝트로 되돌릴까요? (이 기기의 다른 기록은 그대로 남아요)')) return;
  localStorage.removeItem('gnfam_firebase_config');
  location.reload();
}
function confirmReset(){ if(confirm('이 기기에 저장된 모든 기록(퀴즈, 스탬프, 사진, 이야기 등)을 초기화할까요?')) resetAllData(); }
function resetAllData(){ Object.keys(localStorage).filter(k=>k.startsWith('gnfam_')).forEach(k=>localStorage.removeItem(k)); toast('초기화했어요.'); closeModal(); renderAll(); }

/* ---------- 시작 ---------- */
function init(){
  try{
    if(firebaseReady){
      db.collection('settings').doc('gangneung_family').onSnapshot(snap => {
        if(snap.exists){
          const data=snap.data();
          if(data.stay) lsSet('stay', data.stay);
          if(Array.isArray(data.pre_stamp_spots) && data.pre_stamp_spots.length) lsSet('pre_stamp_spots', data.pre_stamp_spots);
          renderAll();
        }
      });
    }
    renderAll();
  }
  catch(e){ console.error(e); document.getElementById('main').innerHTML='<div class="wrap"><div class="card"><h3>문제가 발생했어요</h3><p>'+escapeHtml(String(e.message||e))+'</p></div></div>'; }
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
